<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SynapseHive</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --bg:       #F4F8FB;
      --text:     #061226;
      --link:     #1167FA;
      --email:    #1166F9;
    }
    [data-theme="dark"] {
      --bg:       #061226;
      --text:     #F4F8FB;
      --link:     #1168FF;
      --email:    #1168FF;
    }

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      /* Desktop only: lock to one viewport — tablet/mobile scroll freely */
      overflow: hidden;
      height: 100%;
      transition: background-color .3s, color .3s;
    }
    img { display: block; }
    a   { text-decoration: none; }

    /* ── Page shell ─────────────────────────────────────── */
    .page {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px;
      overflow: hidden;
    }

    /* ── Background ─────────────────────────────────────── */
    .bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: right center;
    }

    header, main, footer { position: relative; z-index: 1; }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo-gif {
      height: 45px;
      width: auto;
      object-fit: contain;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    /* Toggle pill — uses flexbox so nob is always perfectly centred vertically */
    .toggle {
      display: flex;
      align-items: center;
      width: 52px;
      height: 26px;
      border-radius: 32px;
      background: #1168FF;
      border: 1px solid #1168FF;
      cursor: pointer;
      padding: 2px;
      flex-shrink: 0;
    }
    .toggle-nob {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
      /* translateX travel = toggle_width - 2*border - 2*padding - nob_width */
      /* desktop: 52 - 2 - 4 - 22 = 24px */
      transition: transform .25s ease;
    }
    [data-theme="dark"] .toggle-nob { transform: translateX(24px); }

    /* Social icons */
    .socials {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .socials a  { display: flex; align-items: center; }
    .socials img { width: 26px; height: 26px; }

    /* ── Hero ───────────────────────────────────────────── */
    main {
      display: flex;
      flex-direction: column;
      gap: 40px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 140px;
      font-weight: 600;
      line-height: auto;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
    }

    .body-text { display: flex; flex-direction: column; }
    .body-text p {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--text);
    }
    .body-text .gap { height: 18px; }
    .body-text a {
      color: var(--link);
      text-decoration: underline;
      font-weight: 600;
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .trusted-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 51px;
      height: 41px;
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    /* Desktop logos — single row */
    .logos-row-d {
      display: flex;
      align-items: center;
      gap: 70px;
    }
    .logos-row-m { display: none; }

    /* Individual partner logo sizes (desktop) */
    .p-2k         { height: 36px; width: 46px;  flex-shrink: 0; }
    .p-audi       { height: 21px; width: 62px;  flex-shrink: 0; }
    .p-alef       { height: 39px; width: 75px;  flex-shrink: 0; }
    .p-wayfair    { height: 24px; width: 101px; flex-shrink: 0; }
    .p-sourcewell { height: 20px; width: 113px; flex-shrink: 0; }

    /* EIB — two absolutely-positioned parts (desktop insets from Figma) */
    .p-eib {
      position: relative;
      width: 158px;
      height: 42px;
      flex-shrink: 0;
    }
    .eib-badge {
      position: absolute;
      top: 10.58%; right: 57.53%; bottom: 18.16%; left: 2.93%;
    }
    .eib-badge img { width: 100%; height: 100%; object-fit: contain; }
    .eib-label {
      position: absolute;
      top: 47.08%; right: 12.25%; bottom: 17.87%; left: 47%;
    }
    .eib-label img { width: 100%; height: 100%; object-fit: contain; }

    /* EIB mobile insets — from Figma mobile frame (128×34 container).
       Badge moves down, label sits flush at the bottom edge.            */
    @media (max-width: 767px) {
      .eib-badge { top: 29.41%; right: 57.53%; bottom: -0.67%; left: 2.93%; }
      .eib-label { top: 64.71%; right: 12.25%; bottom:  0.24%; left: 47%;   }
    }

    .questions {
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      white-space: nowrap;
      line-height: 16px;
    }
    .questions a { color: var(--email); }

    /* ── Tablet: portrait + landscape ≤ 1280px ─────────────
       1280px catches all common iPads in both orientations
       (iPad Pro 11" landscape = 1194px, iPad Pro 12.9" portrait = 1024px)  */
    @media (max-width: 1366px) {
      body { overflow: auto; height: auto; }

      .page {
        padding: 30px;
        height: auto;
        min-height: 100svh;
        min-height: 100vh;
        overflow: visible;
      }

      .logo-gif { height: 40px; }
      .header-right { gap: 35px; }

      /* toggle: 42×21, nob 17×17, travel = 42-2-4-17 = 19px */
      .toggle { width: 42px; height: 21px; }
      .toggle-nob { width: 17px; height: 17px; }
      [data-theme="dark"] .toggle-nob { transform: translateX(19px); }

      .socials img { width: 24px; height: 24px; }

      h1 { font-size: 110px; }
      .body-text p { font-size: 16px; }

      /* .trusted needs explicit width so logos-row-d width:100% resolves */
      .trusted { width: 100%; }
      .logos-row-d {
        width: 100%;
        gap: 40px;                    /* visible minimum gap between logos */
        justify-content: space-between;
        align-items: center;
      }
      .p-eib { width: 138px; height: 37px; }

      .questions { display: none; }
    }

    /* ── Tablet landscape ──────────────────────────────────── */
    @media (orientation: landscape) and (min-height: 501px) and (max-width: 1366px) {
      .bg img { object-position: center; }
    }

    /* ── Mobile portrait ≤ 767px ──────────────────────────── */
    @media (max-width: 767px) {
      .page { padding: 25px; }

      .logo-gif { height: 30px; }
      .header-right { gap: 24px; }

      /* toggle: 35×18, nob 14×14, travel = 35-2-4-14 = 15px */
      .toggle { width: 35px; height: 18px; }
      .toggle-nob { width: 14px; height: 14px; }
      [data-theme="dark"] .toggle-nob { transform: translateX(15px); }

      .socials { gap: 13px; }
      .socials img { width: 20px; height: 20px; }

      main { gap: 20px; }
      h1 { font-size: 47px; white-space: normal; }
      .body-text p { font-size: 14px; }

      /* Switch to two-row logos */
      .logos-row-d { display: none; }
      .logos-row-m { display: flex; flex-direction: column; gap: 15px; }
      .logos-row-m .row { display: flex; align-items: flex-end; gap: 30px; }

      .p-2k         { height: 20px; width: 26px; }
      .p-audi       { height: 14px; width: 42px; }
      .p-alef       { height: 23px; width: 45px; }
      .p-wayfair    { height: 17px; width: 71px; }
      .p-sourcewell { height: 16px; width: 93px; }
      .p-eib        { width: 128px; height: 34px; }

      .trusted-label { font-size: 10px; }
      footer { padding-top: 40px; }
    }

    /* ── Mobile landscape: phone rotated ────────────────────
       Typography/icons/logo: MOBILE sizes.
       Background: desktop bg (set in JS via orientation check).
       Width ~844px so keep the single logos row.
       min-height 680px forces the page taller than the ~390px
       landscape viewport so content can breathe and scroll.    */
    @media (orientation: landscape) and (max-height: 500px) {
      body { overflow: auto; height: auto; }
      .page {
        padding: 25px;
        min-height: 500px;
        height: auto;
        overflow: visible;
      }
      .logo-gif { height: 30px; }
      .header-right { gap: 24px; }
      .toggle { width: 35px; height: 18px; }
      .toggle-nob { width: 14px; height: 14px; }
      [data-theme="dark"] .toggle-nob { transform: translateX(15px); }
      .socials { gap: 13px; }
      .socials img { width: 20px; height: 20px; }
      main { gap: 20px; }
      h1 { font-size: 47px; white-space: normal; }
      .body-text p { font-size: 14px; }
      /* Single row with mobile-sized logos */
      .logos-row-d { display: flex; }
      .logos-row-m { display: none; }
      .p-2k         { height: 20px; width: 26px; }
      .p-audi       { height: 14px; width: 42px; }
      .p-alef       { height: 23px; width: 45px; }
      .p-wayfair    { height: 17px; width: 71px; }
      .p-sourcewell { height: 16px; width: 93px; }
      .p-eib        { width: 128px; height: 34px; }
      .trusted-label { font-size: 10px; }
      footer { padding-top: 0; }
    }

  </style>
</head>
<body>
<div class="page">

  <!-- ░░ Background ░░ -->
  <div class="bg" aria-hidden="true">
    <img id="bgImg" src="assets/bg-desktop-light.png" alt="">
  </div>

  <!-- ░░ Header ░░ -->
  <header>
    <a href="#">
      <img class="logo-gif" id="logoImg"
           src="assets/logo-full-light.gif"
           onerror="this.onerror=null;this.src='assets/icon-light.svg'"
           alt="SynapseHive">
    </a>

    <div class="header-right">
      <button class="toggle" id="toggle" aria-label="Toggle dark mode">
        <div class="toggle-nob"></div>
      </button>
      <div class="socials">
        <a href="https://www.linkedin.com/company/synapse-hive/"
           target="_blank" rel="noopener" aria-label="LinkedIn">
          <img id="liImg" src="assets/linkedin-light.svg" alt="LinkedIn">
        </a>
        <a href="https://www.instagram.com/synapsehive.io/"
           target="_blank" rel="noopener" aria-label="Instagram">
          <img id="igImg" src="assets/instagram-light.svg" alt="Instagram">
        </a>
      </div>
    </div>
  </header>

  <!-- ░░ Hero ░░ -->
  <main>
    <h1>Scale smarter.<br>Ship faster.</h1>
    <div class="body-text">
      <p>We deploy vetted development teams to your project within 48 hours.</p>
      <p>No recruiting, no ramp-up — just expert engineers delivering from day one.&nbsp;</p>
      <div class="gap"></div>
      <p>Get ready to plug into the Hive.&nbsp;<a
           href="https://calendly.com/jakub-chmielewski-synapsehive/30min"
           target="_blank" rel="noopener">Book a call.</a></p>
    </div>
  </main>

  <!-- ░░ Footer ░░ -->
  <footer>
    <div class="trusted">
      <p class="trusted-label">Trusted by:</p>

      <!-- Desktop / Tablet: single row -->
      <div class="logos-row-d">
        <img class="p-2k"         src="assets/2k-light.svg"         alt="2K Games">
        <img class="p-audi"       src="assets/audi-light.svg"       alt="Audi">
        <img class="p-alef"       src="assets/alef-light.svg"       alt="Alef">
        <img class="p-wayfair"    src="assets/wayfair-light.svg"    alt="Wayfair">
        <img class="p-sourcewell" src="assets/sourcewell-light.svg" alt="Sourcewell">
        <div class="p-eib">
          <div class="eib-badge"><img src="assets/eib-1-light.svg" alt=""></div>
          <div class="eib-label"><img src="assets/eib-2-light.svg" alt="European Investment Bank"></div>
        </div>
      </div>

      <!-- Mobile: two rows -->
      <div class="logos-row-m">
        <div class="row">
          <img class="p-2k"   src="assets/2k-light.svg"   alt="2K Games">
          <img class="p-audi" src="assets/audi-light.svg" alt="Audi">
          <img class="p-alef" src="assets/alef-light.svg" alt="Alef">
        </div>
        <div class="row">
          <img class="p-wayfair"    src="assets/wayfair-light.svg"    alt="Wayfair">
          <img class="p-sourcewell" src="assets/sourcewell-light.svg" alt="Sourcewell">
          <div class="p-eib">
            <div class="eib-badge"><img src="assets/eib-1-light.svg" alt=""></div>
            <div class="eib-label"><img src="assets/eib-2-light.svg" alt="European Investment Bank"></div>
          </div>
        </div>
      </div>
    </div>

    <p class="questions">Questions?&nbsp;<a href="mailto:contact@synapsehive.io">contact@synapsehive.io&nbsp;</a></p>
  </footer>

</div><!-- .page -->

<script>
(function () {
  const html = document.documentElement;

  const A = {
    light: {
      bgD:  'assets/bg-desktop-light.png',
      bgT:  'assets/bg-tablet-light.png',
      bgM:  'assets/bg-mobile-light.png',
      logo: 'assets/logo-full-light.gif',
      li:   'assets/linkedin-light.svg',
      ig:   'assets/instagram-light.svg',
      '2k':         'assets/2k-light.svg',
      audi:         'assets/audi-light.svg',
      alef:         'assets/alef-light.svg',
      wayfair:      'assets/wayfair-light.svg',
      sourcewell:   'assets/sourcewell-light.svg',
      'eib-1':      'assets/eib-1-light.svg',
      'eib-2':      'assets/eib-2-light.svg',
    },
    dark: {
      bgD:  'assets/bg-desktop-dark.png',
      bgT:  'assets/bg-tablet-dark.png',
      bgM:  'assets/bg-mobile-dark.png',
      logo: 'assets/logo-full-dark.gif',
      li:   'assets/linkedin-dark.svg',
      ig:   'assets/instagram-dark.svg',
      '2k':         'assets/2k-dark.svg',
      audi:         'assets/audi-dark.svg',
      alef:         'assets/alef-dark.svg',
      wayfair:      'assets/wayfair-dark.svg',
      sourcewell:   'assets/sourcewell-dark.svg',
      'eib-1':      'assets/eib-1-dark.svg',
      'eib-2':      'assets/eib-2-dark.svg',
    }
  };

  function bgSrc(a) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const landscape = w > h;

    if (landscape && h <= 500) {
      // Mobile landscape → desktop background
      return a.bgD;
    }
    if (w <= 767) {
      // Mobile portrait → mobile background
      return a.bgM;
    }
    if (landscape && w <= 1400) {
      // Tablet landscape (iPad rotated) → desktop background (landscape-oriented)
      return a.bgD;
    }
    if (w <= 1366) {
      // Tablet portrait → tablet background
      return a.bgT;
    }
    // Desktop
    return a.bgD;
  }

  function apply(theme) {
    html.setAttribute('data-theme', theme);
    const a = A[theme];

    document.getElementById('bgImg').src  = bgSrc(a);
    document.getElementById('logoImg').src = a.logo;
    document.getElementById('liImg').src   = a.li;
    document.getElementById('igImg').src   = a.ig;

    const swap = (sel, src) => document.querySelectorAll(sel).forEach(el => el.src = src);
    swap('.p-2k',         a['2k']);
    swap('.p-audi',       a.audi);
    swap('.p-alef',       a.alef);
    swap('.p-wayfair',    a.wayfair);
    swap('.p-sourcewell', a.sourcewell);
    swap('.eib-badge img', a['eib-1']);
    swap('.eib-label img', a['eib-2']);

    localStorage.setItem('sh-theme', theme);
  }

  /* Initial load */
  const saved = localStorage.getItem('sh-theme');
  const sys   = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  apply(saved || sys);

  /* Toggle button */
  document.getElementById('toggle').addEventListener('click', () => {
    apply(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* Swap bg on resize (portrait ↔ landscape) */
  let rTimer;
  addEventListener('resize', () => {
    clearTimeout(rTimer);
    rTimer = setTimeout(() => apply(html.getAttribute('data-theme')), 120);
  });

  /* System preference */
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('sh-theme')) apply(e.matches ? 'dark' : 'light');
  });
}());
</script>
</body>
</html>
